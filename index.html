<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bản Đồ Hành Chính Tương Tác</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; display: flex; height: 100vh; background: #0b0f19; color: white; font-family: sans-serif; overflow: hidden; }
        #sidebar { width: 350px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 10; }
        .search { padding: 15px; border-bottom: 1px solid #1e293b; background: rgba(30, 41, 59, 0.5); }
        #search-input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #1e293b; background: #1e293b; color: white; box-sizing: border-box; outline: none; }
        #search-input:focus { border-color: #38bdf8; }
        #list { flex: 1; overflow-y: auto; padding: 5px; }
        .item { padding: 12px 15px; cursor: pointer; border-radius: 6px; margin-bottom: 4px; transition: 0.2s; font-size: 13px; font-weight: 500; }
        .item:hover { background: rgba(56, 189, 248, 0.15); }
        .item.active { background: rgba(250, 204, 21, 0.2); color: #facc15; border-left: 4px solid #facc15; }
        #map { flex: 1; position: relative; }
        #info { position: absolute; bottom: 30px; right: 30px; width: 340px; background: rgba(15, 23, 42, 0.95); padding: 20px; border-radius: 12px; border: 1px solid #38bdf8; z-index: 1000; box-shadow: 0 15px 35px rgba(0,0,0,0.5); backdrop-filter: blur(8px); }
        h4 { margin: 0 0 12px 0; color: #38bdf8; font-size: 16px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
        .row { margin-bottom: 10px; font-size: 13px; }
        .label { color: #94a3b8; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; margin-bottom: 2px; }
        .value { color: #f8fafc; font-weight: 500; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="search">
            <input type="text" id="search-input" placeholder="🔍 Tìm kiếm tỉnh/thành...">
        </div>
        <div id="list"></div>
    </div>
    
    <div id="map">
        <div id="info">
            <h4 id="info-name">Chọn một địa điểm</h4>
            <div class="row"><div class="label">Dân số</div><div id="info-pop" class="value">-</div></div>
            <div class="row"><div class="label">Diện tích</div><div id="info-size" class="value">-</div></div>
            <div class="row"><div class="label">Du lịch</div><div id="info-tour" class="value">-</div></div>
            <div class="row"><div class="label">Đặc điểm</div><div id="info-special" class="value">-</div></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const db = {
            "Lào Cai": { pop: "1.778.785 người", size: "13.256,92 km²", tour: "Sapa, Fansipan, Bản Cát Cát, Y Tý", special: "Sáp nhập Yên Bái và Lào Cai." },
            "Thái Nguyên": { pop: "1.799.489 người", size: "8.375,21 km²", tour: "Hồ Núi Cốc, Chợ Thái, Đan viện Chợ Chu", special: "Sáp nhập Bắc Kạn và Thái Nguyên." },
            "Phú Thọ": { pop: "4.022.638 người", size: "9.361,38 km²", tour: "Đền Hùng, Đầm Ao Châu, Vườn quốc gia Xuân Sơn", special: "Sáp nhập Vĩnh Phúc, Hòa Bình, Phú Thọ." },
            "Bắc Ninh": { pop: "3.619.433 người", size: "4.718,6 km²", tour: "Chùa Dâu, Chùa Phật Tích, Đền Đô, Làng tranh Đông Hồ", special: "Sáp nhập Bắc Giang và Bắc Ninh." },
            "Hưng Yên": { pop: "3.567.943 người", size: "2.514,81 km²", tour: "Phố Hiến, Đền Chử Đồng Tử, Làng hương Quảng Phú Cầu", special: "Sáp nhập Thái Bình và Hưng Yên." },
            "Hải Phòng": { pop: "4.664.124 người", size: "3.194,72 km²", tour: "Cát Bà, Đồ Sơn, Vịnh Lan Hạ, Biệt thự Bảo Đại", special: "Sáp nhập Hải Phòng và Hải Dương." },
            "Ninh Bình": { pop: "4.412.264 người", size: "3.942,62 km²", tour: "Tràng An, Hang Múa, Chùa Bái Đính, Tam Cốc - Bích Động", special: "Sáp nhập Hà Nam, Nam Định, Ninh Bình." },
            "Quảng Trị": { pop: "1.870.845 người", size: "12.700 km²", tour: "Thành cổ Quảng Trị, Địa đạo Vịnh Mốc, Biển Cửa Tùng", special: "Sáp nhập Quảng Bình và Quảng Trị." },
            "Đà Nẵng": { pop: "3.065.628 người", size: "11.859,59 km²", tour: "Bà Nà Hills, Cầu Rồng, Bãi biển Mỹ Khê, Ngũ Hành Sơn, Hội An", special: "Sáp nhập Đà Nẵng và Quảng Nam." },
            "Quảng Ngãi": { pop: "2.161.755 người", size: "14.832,55 km²", tour: "Đảo Lý Sơn, Biển Mỹ Khê Quảng Ngãi, Thành cổ Châu Sa", special: "Sáp nhập Kon Tum và Quảng Ngãi." },
            "Gia Lai": { pop: "3.583.693 người", size: "21.576,53 km²", tour: "Biển Hồ, Thác Phú Cường, Núi lửa Chư Đăng Ya", special: "Sáp nhập Bình Định và Gia Lai." },
            "Khánh Hòa": { pop: "2.243.554 người", size: "8.555,86 km²", tour: "Vịnh Nha Trang, VinWonders, Đảo Điệp Sơn, Tháp Bà Ponagar", special: "Sáp nhập Ninh Thuận và Khánh Hòa." },
            "Lâm Đồng": { pop: "3.872.999 người", size: "24.233,07 km²", tour: "Đà Lạt, Thung lũng Tình yêu, Hồ Tuyền Lâm, Langbiang", special: "Sáp nhập Đắk Nông, Bình Thuận, Lâm Đồng." },
            "Đắk Lắk": { pop: "3.346.853 người", size: "18.096,40 km²", tour: "Buôn Đôn, Hồ Lắk, Thác Dray Nur, Thác Dray Sáp", special: "Sáp nhập Phú Yên và Đắk Lắk." },
            "TP. Hồ Chí Minh": { pop: "14.002.598 người", size: "6.772,59 km²", tour: "Dinh Độc Lập, Landmark 81, Phố đi bộ Nguyễn Huệ, Thảo Cầm Viên", special: "Sáp nhập TP.HCM, BR-VT, Bình Dương." },
            "Đồng Nai": { pop: "4.491.408 người", size: "12.737,18 km²", tour: "Vườn quốc gia Nam Cát Tiên, Hồ Trị An, Khu du lịch Bửu Long", special: "Sáp nhập Bình Phước và Đồng Nai." },
            "Tây Ninh": { pop: "3.254.170 người", size: "8.536,44 km²", tour: "Núi Bà Đen, Hồ Dầu Tiếng, Tòa thánh Tây Ninh", special: "Sáp nhập Long An và Tây Ninh." },
            "Cần Thơ": { pop: "4.199.824 người", size: "6.360,83 km²", tour: "Chợ nổi Cái Răng, Bến Ninh Kiều, Vườn cò Bằng Lăng", special: "Sáp nhập Cần Thơ, Sóc Trăng, Hậu Giang." },
            "Vĩnh Long": { pop: "4.257.581 người", size: "6.296,20 km²", tour: "Cù lao An Bình, Chợ nổi Trà Ôn, Văn thánh miếu Vĩnh Long", special: "Sáp nhập Bến Tre, Trà Vinh, Vĩnh Long." },
            "Đồng Tháp": { pop: "4.370.046 người", size: "5.938,64 km²", tour: "Làng hoa Sa Đéc, Khu di tích Xẻo Quít, Vườn quốc gia Tràm Chim", special: "Sáp nhập Tiền Giang và Đồng Tháp." },
            "Cà Mau": { pop: "2.606.672 người", size: "7.942,39 km²", tour: "Mũi Cà Mau, Rừng ngập mặn Cà Mau, Hòn Đá Bạc", special: "Sáp nhập Bạc Liêu và Cà Mau." },
            "An Giang": { pop: "4.952.238 người", size: "9.888,91 km²", tour: "Rừng tràm Trà Sư, Núi Sam, Miếu Bà Chúa Xứ, Chợ nổi Long Xuyên", special: "Sáp nhập Kiên Giang và An Giang." },
            "Hà Nội": { pop: "8.500.000 người", size: "3.359 km²", tour: "Hồ Gươm, Lăng Bác, Phố Cổ, Hoàng thành Thăng Long, Văn Miếu", special: "Thủ đô." },
            "Hà Giang": { pop: "880.000 người", size: "7.929 km²", tour: "Cao nguyên đá Đồng Văn, Cột mốc Lô Cú, Mã Pì Lèng, Dinh Vua Mèo", special: "Cực Bắc." },
            "Cao Bằng": { pop: "540.000 người", size: "6.700 km²", tour: "Thác Bản Giốc, Động Ngườm Ngao, Pác Bó", special: "Lịch sử cách mạng." },
            "Lạng Sơn": { pop: "800.000 người", size: "8.310 km²", tour: "Cửa khẩu Tân Thanh, Động Tam Thanh, Chợ Kỳ Sà, Mẫu Sơn", special: "Cửa khẩu." },
            "Sơn La": { pop: "1.280.000 người", size: "14.123 km²", tour: "Cao nguyên Mộc Châu, Đồi chè trái tim, Thác Dải Yếm", special: "Tây Bắc." },
            "Lai Châu": { pop: "470.000 người", size: "9.068 km²", tour: "Đèo Ô Quy Hồ, Bản Tẻ Ho, Động Tiên Sơn", special: "Vùng cao." },
            "Điện Biên": { pop: "630.000 người", size: "9.541 km²", tour: "Đồi A1, Hầm De Castries, Hồ Pá Khoang, Bảo tàng Chiến thắng", special: "Chiến thắng lịch sử." },
            "Thanh Hóa": { pop: "3.645.000 người", size: "11.114 km²", tour: "Biển Sầm Sơn, Thành nhà Hồ, Suối cá thần Cẩm Lương", special: "Miền Trung." },
            "Nghệ An": { pop: "3.400.000 người", size: "16.490 km²", tour: "Làng Sen quê Bác, Biển Cửa Lò, Vườn quốc gia Pù Mát", special: "Quê Bác." },
            "Hà Tĩnh": { pop: "1.300.000 người", size: "5.997 km²", tour: "Biển Thiên Cầm, Ngã ba Đồng Lộc, Chùa Hương Tích", special: "Hiếu học." },
            "Bình Định": { pop: "1.500.000 người", size: "6.066 km²", tour: "Eo Gió, Kỳ Co, Tháp Đôi, Ghềnh Ráng Tiên Sa", special: "Đất võ." },
            "Phú Yên": { pop: "1.000.000 người", size: "5.045 km²", tour: "Gành Đá Đĩa, Bãi Xép (Hoa vàng cỏ xanh), Hòn Yến", special: "Hoa vàng cỏ xanh." },
            "Kiên Giang": { pop: "1.725.350 người", size: "6.348,38 km²", tour: "Phú Quốc, Quần đảo Nam Du, Hòn Sơn, U Minh Thượng", special: "Vùng biển đảo Tây Nam." },
            "Long An": { pop: "1.767.750 người", size: "4.494,02 km²", tour: "Làng nổi Tân Lập, Cánh đồng bất tận, Khu di tích Vàm Nhựt Tảo", special: "Cửa ngõ miền Tây." }
        };

        const map = L.map('map', { zoomControl: false }).setView([16.0, 107.5], 6);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd'
        }).addTo(map);

        let geojsonLayer = null;
        let activeLayer = null;
        const sortedKeys = Object.keys(db).sort();
        const listContainer = document.getElementById('list');

        function cleanStr(str) {
            if (!str) return '';
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '');
        }

        function findDbName(gadmName) {
            if (!gadmName) return null;
            const cleanGadm = cleanStr(gadmName);
            
            // Xử lý các vùng sáp nhập đặc thù
            if (cleanGadm.includes("hochiminh")) return "TP. Hồ Chí Minh";
            if (cleanGadm.includes("daknong")) return "Lâm Đồng";

            return sortedKeys.find(key => cleanStr(key) === cleanGadm) || null;
        }

        function renderList(filter = "") {
            listContainer.innerHTML = '';
            sortedKeys.forEach(name => {
                if (filter && !cleanStr(name).includes(cleanStr(filter))) return;

                const div = document.createElement('div');
                div.className = 'item';
                div.innerText = name;
                div.dataset.name = name;
                div.onclick = () => {
                    const targetFeature = geojsonLayer.getLayers().find(l => findDbName(l.feature.properties.NAME_1) === name);
                    if (targetFeature) {
                        highlightAndSelect(name, targetFeature);
                    }
                };
                listContainer.appendChild(div);
            });
        }

        fetch('gadm41_VNM_1.json')
            .then(res => res.json())
            .then(data => initMap(data))
            .catch(() => {
                fetch('./gadm41_VNM_1.json')
                    .then(res => res.json())
                    .then(data => initMap(data));
            });

        function initMap(data) {
            geojsonLayer = L.geoJSON(data, {
                style: { color: '#38bdf8', weight: 1.5, fillOpacity: 0.25, fillColor: '#38bdf8' },
                onEachFeature: (feature, layer) => {
                    const dbName = findDbName(feature.properties.NAME_1);
                    layer.on('click', () => {
                        if (dbName) {
                            highlightAndSelect(dbName, layer);
                        } else {
                            if (activeLayer) geojsonLayer.resetStyle(activeLayer);
                            activeLayer = layer;
                            layer.setStyle({ color: '#facc15', fillColor: '#facc15', fillOpacity: 0.4, weight: 2.5 });
                            document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
                            
                            document.getElementById('info-name').innerText = feature.properties.NAME_1;
                            document.getElementById('info-pop').innerText = "Đang cập nhật";
                            document.getElementById('info-size').innerText = "Đang cập nhật";
                            document.getElementById('info-tour').innerText = "Đang cập nhật";
                            document.getElementById('info-special').innerText = "Khu vực ngoài danh sách.";
                        }
                    });
                }
            }).addTo(map);

            renderList();
            if (sortedKeys.length > 0) {
                const firstKey = sortedKeys[0];
                const firstLayer = geojsonLayer.getLayers().find(l => findDbName(l.feature.properties.NAME_1) === firstKey);
                if (firstLayer) highlightAndSelect(firstKey, firstLayer);
            }
        }

        function highlightAndSelect(name, layer) {
            if (activeLayer) {
                geojsonLayer.resetStyle(activeLayer);
            }
            activeLayer = layer;
            
            layer.setStyle({ color: '#facc15', fillColor: '#facc15', fillOpacity: 0.4, weight: 2.5 });
            map.fitBounds(layer.getBounds(), { padding: [50, 50], maxZoom: 10 });

            document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
            const activeItem = Array.from(document.querySelectorAll('.item')).find(i => i.dataset.name === name);
            if (activeItem) {
                activeItem.classList.add('active');
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            const info = db[name];
            document.getElementById('info-name').innerText = name;
            
            if (info) {
                document.getElementById('info-pop').innerText = info.pop;
                document.getElementById('info-size').innerText = info.size;
                document.getElementById('info-tour').innerText = info.tour;
                document.getElementById('info-special').innerText = info.special;
            } else {
                document.getElementById('info-pop').innerText = "Đang cập nhật";
                document.getElementById('info-size').innerText = "Đang cập nhật";
                document.getElementById('info-tour').innerText = "Đang cập nhật";
                document.getElementById('info-special').innerText = "Đang cập nhật";
            }
        }

        document.getElementById('search-input').oninput = (e) => {
            renderList(e.target.value);
        };
    </script>
</body>
</html>
