<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bản Đồ Hành Chính Tương Tác</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; display: flex; height: 100vh; background: #0b0f19; color: white; font-family: sans-serif; overflow: hidden; }
        #sidebar { width: 350px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 10; }
        .search { padding: 15px; border-bottom: 1px solid #1e293b; background: rgba(30, 41, 59, 0.5); }
        #search-input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #1e293b; background: #1e293b; color: white; box-sizing: border-box; outline: none; }
        #search-input:focus { border-color: #38bdf8; }
        #list { flex: 1; overflow-y: auto; padding: 5px; }
        .item { padding: 12px 15px; cursor: pointer; border-radius: 6px; margin-bottom: 4px; transition: 0.2s; font-size: 13px; font-weight: 500; }
        .item:hover { background: rgba(56, 189, 248, 0.15); }
        .item.active { background: rgba(250, 204, 21, 0.2); color: #facc15; border-left: 4px solid #facc15; }
        #map { flex: 1; position: relative; }
        #info { position: absolute; bottom: 30px; right: 30px; width: 340px; background: rgba(15, 23, 42, 0.95); padding: 20px; border-radius: 12px; border: 1px solid #38bdf8; z-index: 1000; box-shadow: 0 15px 35px rgba(0,0,0,0.5); backdrop-filter: blur(8px); }
        h4 { margin: 0 0 12px 0; color: #38bdf8; font-size: 16px; border-bottom: 1px solid #1e293b; padding-bottom: 8px; }
        .row { margin-bottom: 10px; font-size: 13px; }
        .label { color: #94a3b8; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; margin-bottom: 2px; }
        .value { color: #f8fafc; font-weight: 500; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="search">
            <input type="text" id="search-input" placeholder="🔍 Tìm kiếm tỉnh/thành...">
        </div>
        <div id="list"></div>
    </div>
    
    <div id="map">
        <div id="info">
            <h4 id="info-name">Chọn một địa điểm</h4>
            <div class="row"><div class="label">Dân số</div><div id="info-pop" class="value">-</div></div>
            <div class="row"><div class="label">Diện tích</div><div id="info-size" class="value">-</div></div>
            <div class="row"><div class="label">Du lịch</div><div id="info-tour" class="value">-</div></div>
            <div class="row"><div class="label">Đặc điểm</div><div id="info-special" class="value">-</div></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const db = {
            "Lào Cai": { pop: "1.778.785", size: "13.256,92 km²", tour: "Sapa, Fansipan, Bản Cát Cát, Y Tý", special: "Sáp nhập Yên Bái và Lào Cai." },
            "Hà Nội": { pop: "8.500.000", size: "3.359 km²", tour: "Hồ Gươm, Lăng Bác, Phố Cổ, Hoàng thành Thăng Long", special: "Thủ đô văn hóa." },
            "Đà Nẵng": { pop: "3.065.628", size: "11.859,59 km²", tour: "Bà Nà Hills, Cầu Rồng, Bãi biển Mỹ Khê, Ngũ Hành Sơn", special: "Thành phố đáng sống." },
            "Quảng Ninh": { pop: "1.400.000", size: "6.178 km²", tour: "Vịnh Hạ Long, Tuần Châu, Yên Tử, Cô Tô", special: "Di sản thiên nhiên thế giới." },
            "Lâm Đồng": { pop: "3.872.999", size: "24.233,07 km²", tour: "Đà Lạt, Thung lũng Tình yêu, Hồ Tuyền Lâm, Langbiang", special: "Thành phố ngàn hoa." },
            "Kiên Giang": { pop: "1.700.000", size: "6.348 km²", tour: "Phú Quốc, Hòn Sơn, Nam Du, Rạch Giá", special: "Đảo ngọc và du lịch biển." },
            "Khánh Hòa": { pop: "2.243.554", size: "8.555,86 km²", tour: "Nha Trang, VinWonders, Đảo Khỉ, Vịnh Vân Phong", special: "Xứ sở trầm hương." },
            "Ninh Bình": { pop: "4.412.264", size: "3.942,62 km²", tour: "Tràng An, Hang Múa, Chùa Bái Đính, Tam Cốc", special: "Cố đô lịch sử." },
            "TP. Hồ Chí Minh": { pop: "14.002.598", size: "6.772,59 km²", tour: "Dinh Độc Lập, Landmark 81, Địa đạo Củ Chi, Phố đi bộ", special: "Trung tâm kinh tế." }
        };

        // ... Các phần khởi tạo map giữ nguyên ...
        const map = L.map('map', { zoomControl: false }).setView([16.0, 107.5], 6);
        L.control.zoom({ position: 'topright' }).addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        let geojsonLayer = null, activeLayer = null;
        const sortedKeys = Object.keys(db).sort();
        const listContainer = document.getElementById('list');

        function renderList(filter = "") {
            listContainer.innerHTML = '';
            sortedKeys.forEach(name => {
                if (filter && !name.toLowerCase().includes(filter.toLowerCase())) return;
                const div = document.createElement('div');
                div.className = 'item'; div.innerText = name; div.dataset.name = name;
                div.onclick = () => highlightAndSelect(name);
                listContainer.appendChild(div);
            });
        }

        function highlightAndSelect(name) {
            if (activeLayer) geojsonLayer.resetStyle(activeLayer);
            
            // Tìm layer tương ứng trên bản đồ (giả định dùng tên để tìm)
            if(geojsonLayer) {
                geojsonLayer.eachLayer(l => {
                    if(l.feature.properties.NAME_1.includes(name.split(" ")[0])) {
                        activeLayer = l;
                        l.setStyle({ color: '#facc15', fillColor: '#facc15', fillOpacity: 0.4, weight: 2.5 });
                        map.fitBounds(l.getBounds(), { padding: [50, 50] });
                    }
                });
            }

            const info = db[name];
            document.getElementById('info-name').innerText = name;
            // Chỉ thêm chữ "Khoảng" nếu có dữ liệu thực
            document.getElementById('info-pop').innerText = info ? "Khoảng " + info.pop + " người" : "Đang cập nhật";
            document.getElementById('info-size').innerText = info ? "Khoảng " + info.size : "Đang cập nhật";
            document.getElementById('info-tour').innerText = info ? info.tour : "Đang cập nhật";
            document.getElementById('info-special').innerText = info ? info.special : "Đang cập nhật";

            document.querySelectorAll('.item').forEach(i => i.classList.toggle('active', i.dataset.name === name));
        }

        fetch('gadm41_VNM_1.json').then(res => res.json()).then(data => {
            geojsonLayer = L.geoJSON(data, {
                style: { color: '#38bdf8', weight: 1.5, fillOpacity: 0.25 },
                onEachFeature: (f, l) => l.on('click', () => {
                    const name = Object.keys(db).find(k => f.properties.NAME_1.includes(k.split(" ")[0]));
                    if(name) highlightAndSelect(name);
                    else {
                        document.getElementById('info-name').innerText = f.properties.NAME_1;
                        document.getElementById('info-pop').innerText = "Đang cập nhật";
                        document.getElementById('info-size').innerText = "Đang cập nhật";
                        document.getElementById('info-tour').innerText = "Đang cập nhật";
                        document.getElementById('info-special').innerText = "Đang cập nhật";
                    }
                })
            }).addTo(map);
        });

        renderList();
    </script>
</body>
</html>
