<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bản đồ Việt Nam - 34 Đơn vị hành chính</title>
    <!-- Thư viện Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 600px; width: 100%; }
    </style>
</head>
<body>
    <h1>Bản đồ Việt Nam</h1>
    <div id="map"></div>

    <script>
        // Khởi tạo bản đồ
        var map = L.map('map').setView([16.0, 108.0], 6);

        // Thêm lớp nền OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Load file GeoJSON đã định dạng
        fetch('vietnam_34_formatted.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    style: function(feature) {
                        return {
                            color: '#3388ff',
                            weight: 1,
                            fillOpacity: 0.5
                        };
                    },
                    onEachFeature: function(feature, layer) {
                        layer.bindPopup("Tên đơn vị: " + feature.properties.name);
                    }
                }).addTo(map);
            })
            .catch(error => console.error('Lỗi khi tải bản đồ:', error));
    </script>
</body>
</html>
